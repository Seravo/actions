---
name: Setup uv
description: Installs Python and uv

inputs:
  python_version:
    description: "Python version to use"
    required: true
    default: "3.14"
  uv_requirement_path:
    description: "Path to a requirements-uv.txt file"
    required: false

runs:
  using: composite
  steps:
    - id: setup
      name: Setup python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python_version }}
        cache: 'pip'

    - id: install
      name: Install uv
      env:
        uv_requirement_path: ${{ github.action_path }}/requirements.txt
      shell: bash
      run: >-
        pip3 install
        --require-hashes
        -r ${{ inputs.uv_requirement_path || env.uv_requirement_path }}
